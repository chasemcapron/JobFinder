name: Workday crawl

# Crawls the Workday career sites users follow, deeper than a 60-second Vercel function can,
# and writes the postings to the app's database (scripts/crawl-workday.ts). Runs at 04:00 UTC,
# well before the search cron slots (07:00-09:00), which leave freshly crawled sites alone: scheduled
# runs often start late, and the two shouldn't share the Gemini quota at once. The night is split fairly between users (each gets a share of the crawl
# time, then liveness and AI scoring), and the script ends by 85 minutes. Actions minutes are free
# on a public repo. GitHub pauses schedules after 60 days without repository activity.
#
# Needs repository secrets DATABASE_URL and GEMINI_API_KEY. This workflow runs only on its
# schedule or by hand, never for pull requests, so forks can't reach the secrets.
# Logs are public on a public repo: the script prints counts only.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workday-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Crawl
        run: npx tsx scripts/crawl-workday.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NODE_ENV: production
